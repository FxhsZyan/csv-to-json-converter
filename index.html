<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV to JSON - Data Conversion Exercise</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --navy: #2d3577;
      --navy-deep: #151a3d;
      --teal: #43bfbf;
      --peach: #ffa98c;
      --ink: #e8ecff;
      --muted: #9aa3d1;
      --glass: rgba(255, 255, 255, 0.05);
      --border: rgba(67, 191, 191, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Space Grotesk', Arial, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background: #151a3d;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 22px 26px;
      border-radius: 20px;
      background: #2d3577;
      border: 1px solid var(--border);
      box-shadow: 0 0 40px rgba(67,191,191,0.15);
      margin-bottom: 28px;
    }

    .logo {
      width: 84px;
      height: 84px;
      border-radius: 18px;
      flex-shrink: 0;
      box-shadow: 0 0 24px rgba(67,191,191,0.45);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    h1 {
      font-size: 2em;
      margin: 0;
      letter-spacing: -0.5px;
      color: #e8ecff;
    }

    .sub {
      margin: 6px 0 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--peach);
    }

    .card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      backdrop-filter: blur(8px);
    }

    h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--teal);
      margin: 0 0 14px;
    }

    input[type="file"] {
      color: var(--muted);
      font-size: 14px;
      margin-right: 10px;
    }
    input[type="file"]::file-selector-button {
      background: rgba(255,255,255,0.08);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      margin-right: 10px;
      cursor: pointer;
    }

    button {
      padding: 10px 20px;
      margin-top: 12px;
      background: var(--teal);
      color: var(--navy-deep);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 6px 20px rgba(67,191,191,0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(67,191,191,0.45);
    }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled {
      background: rgba(255,255,255,0.1);
      color: var(--muted);
      box-shadow: none;
      cursor: not-allowed;
    }

    pre {
      background: #0b0f2a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      max-height: 400px;
      overflow: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #b8fff5;
      margin: 0;
    }
    pre::-webkit-scrollbar { width: 8px; height: 8px; }
    pre::-webkit-scrollbar-thumb { background: var(--navy); border-radius: 4px; }

    #status {
      color: var(--peach);
      margin-top: 10px;
      font-size: 14px;
    }
  </style>

    const convertBtn = document.getElementById("convertBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const output = document.getElementById("jsonOutput");
    const status = document.getElementById("status");

    // Parses CSV text into an array of row arrays (handles quoted fields and commas inside quotes)
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') { field += '"'; i++; }
          else if (ch === '"') { inQuotes = false; }
          else { field += ch; }
        } else {
          if (ch === '"') { inQuotes = true; }
          else if (ch === ",") { row.push(field); field = ""; }
          else if (ch === "\n" || ch === "\r") {
            if (ch === "\r" && next === "\n") i++;
            row.push(field); field = "";
            rows.push(row); row = [];
          } else { field += ch; }
        }
      }
      if (field !== "" || row.length > 0) { row.push(field); rows.push(row); }

      // Remove completely empty lines
      return rows.filter(r => r.some(cell => cell.trim() !== ""));
    }

    function capitalizeFirst(str) {
      const s = str.trim();
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function transformRecord(headers, values) {
      const get = (name) => {
        const idx = headers.indexOf(name);
        return idx === -1 || values[idx] === undefined ? "" : values[idx].trim();
      };

      const course = get("course");

      return {
        studentId: parseInt(get("student_id"), 10),
        firstName: capitalizeFirst(get("first_name")),
        lastName: capitalizeFirst(get("last_name")),
        program: PROGRAM_NAMES[course.toUpperCase()] || course,
        yearLevel: parseInt(get("year_level"), 10),
        emailAddress: get("email").toLowerCase(),
        outstandingBalance: Number(parseFloat(get("tuition_balance")).toFixed(2))
      };
    }

    convertBtn.addEventListener("click", () => {
      status.textContent = "";
      const file = csvInput.files[0];

      if (!file) {
        status.textContent = "Please choose a CSV file first.";
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const rows = parseCSV(e.target.result);
          if (rows.length < 2) throw new Error("CSV must have a header row and at least one data row.");

          const headers = rows[0].map(h => h.trim().toLowerCase());
          const required = ["student_id", "first_name", "last_name", "course", "year_level", "email", "tuition_balance"];
          const missing = required.filter(r => !headers.includes(r));
          if (missing.length) throw new Error("Missing column(s): " + missing.join(", "));

          jsonResult = rows.slice(1).map(r => transformRecord(headers, r));

          output.textContent = JSON.stringify(jsonResult, null, 2);
          downloadBtn.disabled = false;
        } catch (err) {
          status.textContent = "Error: " + err.message;
          output.textContent = "Conversion failed.";
          jsonResult = null;
          downloadBtn.disabled = true;
        }
      };
      reader.onerror = () => { status.textContent = "Could not read the file."; };
      reader.readAsText(file);
    });

    downloadBtn.addEventListener("click", () => {
      if (!jsonResult) return;
      const blob = new Blob([JSON.stringify(jsonResult, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "output.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
  </div>
</body>
</html>
